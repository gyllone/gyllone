name: GitHub Metrics

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-metrics
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate profile metrics
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: gyllone
          filename: github-metrics.svg
          output_action: commit
          output_condition: data-changed
          committer_message: "chore: update GitHub metrics [skip ci]"

          template: classic
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: no

          config_timezone: Asia/Shanghai
          config_display: large

          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_notable: yes
          plugin_notable_indepth: yes
          plugin_notable_repositories: yes
          plugin_notable_types: commit, pull_request

          commits_authoring: gyllone, Lone G, gyllone1993@gmail.com
